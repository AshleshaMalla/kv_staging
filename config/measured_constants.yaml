# measured_constants.yaml — single source of truth for every number this project claims.
#
# UNITS ARE MANDATORY on every entry. A previous version of this project was
# corrected for conflating GB (10^9 bytes) and GiB (2^30 bytes). Every leaf
# must carry explicit units to prevent this from happening again.
#
# Schema: each leaf is a mapping with keys:
#   value:  the measured number (null if unmeasured)
#   units:  string, REQUIRED even when value is null
#   source: path to raw data under data/ (or "PENDING")
#   script: path to the script that produced this measurement
#   date:   ISO-8601 date of measurement (null if unmeasured)
#   note:   optional free-text

