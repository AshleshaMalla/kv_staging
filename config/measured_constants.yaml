  # ── Authoritative vLLM-based crossover (2026-09-16, audited 2026-09-18) ──
  # Formula (all inputs MEASURED):
  #   T_fetch_per_tok = S/BW + H + M
  #     S = 131072 bytes/tok  [model.kv_bytes_per_token, MEASURED]
  #     H = 2.38e-6 s/tok    [fetch_overhead.v2_h_to_gpu_us_per_token, MEASURED]
  #     M = 6.1e-9 s/tok     [fetch_overhead.metadata_amortized_s_per_token, DERIVED]
  #     BW in bytes/s         [bandwidth.hammerspace_*, MEASURED]
  #   T_recompute(L) = a*L + b*L^2
  #     a = 3.5158e-5 s/tok  [prefill.coeff_a_vllm_s_per_token, MEASURED]
  #     b = 5.8979e-10 s/tok^2 [prefill.coeff_b_vllm_s_per_token2, MEASURED]
  #   L* = (T_fetch_per_tok - a) / b
  #
  # Internal consistency check (2026-09-18): at 2918 MB/s (the implied BW of the
  # v2_full_pipeline measurement), S/BW + H + M = 44.9 + 2.38 + 0.006 = 47.3 us/tok,
  # matching the end-to-end measurement exactly. The decomposition is sound.
  #
  # Payload-only variant (reviewer formula, omitting H and M):
  #   T_fetch_per_tok = S/BW
  # Rows 1, 2, 4 agree qualitatively with our formula. Row 3 (3806 MB/s)
  # disagrees: payload-only gives 34.44 us < a=35.16 us (no crossover),
  # while our formula gives 36.82 us > a (crossover at 2825). The entire
  # row 3 crossover exists because of the 2.38 us H2D term.
  #
  # Concurrency and the crossover (CORRECTED 2026-09-24):
  # On a single GPU, storage link, PCIe link, and GPU compute are ALL shared
  # among N concurrent requests. With shared resources:
  #   T_fetch(N,L) = N*(S/BW + H)*L + M*L   [storage and PCIe shared]
  #   T_recompute_last(N,L) = N*(aL + bL²)   [GPU serialized]
  # Both scale by N, so L* = (S/BW + H - a)/b + M/(N*b) ≈ L*(N=1).
  # The loaded crossover is invariant in N to within ~10 tokens (the M term).
  # The prior model gave each fetch unshared BW, contradicting the measured
  # flat-across-streams storage ceiling. N>1 entries below are WITHDRAWN.
  loaded_crossover_N1_degraded_tokens:
