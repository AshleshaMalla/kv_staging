    date: "2026-09-16"
    note: "WITHDRAWN 2026-09-24. The prior verdict ('fetch dominates under concurrent load; GPU serialization is the decisive factor') assumed each concurrent fetch received full unshared node storage bandwidth and its own PCIe link. On a single GPU, storage link, PCIe link, and GPU compute are all shared among concurrent requests, so all scale by N and cancel. L* is invariant in N to within ~10 tokens (the metadata overhead term). Serialization is real (Q(N) = N*service, measured), but storage and PCIe contention are equally real — the asymmetry that made fetch 'win' under concurrency does not exist on a single node. MEASURED 2026-09-24: multi-GPU scaling test confirmed 98.3-101.7% efficiency at G=1-4 (3 runs, 2 nodes); across a node's GPUs, each GPU has its own compute and PCIe, while the node's storage ceiling is shared — so with more GPUs busy, recompute gains relative to fetch. See multigpu_scaling entry."
  # ── H-sensitivity at 3806 MB/s (2026-09-18 audit) ──
