    source: "data/raw/stability_seeded_157006.out"
    script: "scripts/stability_seeded.py"
    date: "2026-09-19"
    note: "MEASURED 2026-09-19 (replaces INFERRED). 5-seed sweep at slope=1.0: 70% is the only majority-stable load (3/5 stable, 0/5 unstable). 71-83% is transitional (mostly marginal). 84-85% has 2/5 unstable seeds. No sharp boundary — saturation is a zone, not a cliff. The compute-bound estimate of 1.59 req/s does not account for serialization overhead. The slope correction alone (0.85->1.0) moved the stability boundary from ~85% to ~70-76%, a qualitative shift: an assumed 15% batching benefit that does not exist inflates apparent capacity. A deployment sized on that assumption discovers the error during a degradation episode — exactly when the margin matters."

