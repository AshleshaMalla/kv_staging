  # Recompute: T_recompute_last(N,L) = N × (aL + bL²)
  # L* = (fetch_per_tok/N - a) / b
  # NOTE: The crossover for N>1 is PENDING VERIFICATION (see Correction 1 / job 155248).
  # Q(N)=(N-1)×service might be a benchmark artifact of the offline LLM class.

  # ── Loaded crossover (with queueing, 2026-09-16) ──
  # For the LAST request in a wave of N concurrent fallbacks:
  # T_fetch(L) = (S/BW + H + M) × L  [independent of N — each fetches in parallel]
  # T_recompute_last(N,L) = N × (aL + bL²)  [serialized]
  # L* = (fetch_per_tok/N - a) / b
  loaded_crossover_N1_degraded_tokens:
