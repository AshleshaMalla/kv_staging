queue_aware_compute:
  # Breaking ObjectCache's fixed-compute-window assumption (arXiv:2605.22850).
  # ┌─────────────────────────────────────────────────────────────────────┐
  # │ SCOPE: every number here is a FIXED-N result (N=4, the workload size).│
  # │ It tests "compute queue deepens -> c stretches" and NOT "transfers    │
  # │ stretch -> more requests in flight". Concurrency is an INPUT, not an  │
  # │ output. The concurrency-feedback channel is untested (planned         │
  # │ discrete-event follow-on). Do not read sub-additivity as "the effects │
  # │ never compound" — only that they don't through the compute-window     │
  # │ channel at fixed N. See docs/DECISIONS.md 2026-09-17.                  │
  # └─────────────────────────────────────────────────────────────────────┘
  # Pure simulation. Uses OUR vLLM prefill coefficients (a=3.5158e-5,
  # b=5.8979e-10; H100 NVL 400W, SM 960-1035 MHz, FlashAttn v3), NOT the
  # paper's A100 Table A8 numbers. Compute window c = T_prefill(uncached)/L,
  # uncached = ctx*(1-hit).
  rstar_overestimate_factor:
    value: "1.85 / 3.55 / 6.95 / 13.75 at N=2/4/8/16"
    units: "dimensionless ratio"
    source: "data/raw/queue_compute_20260917T035604Z/results.txt"
    script: "analysis/queue_compute.py"
    date: "2026-09-17"
    note: "r*_iso / r*_queued = 1 + 0.85*(N-1), from measured Q(N)=0.85*(N-1)*service (job 155248). ObjectCache allocates r*_iso, so it over-provisions bandwidth to a queued request by this factor — bandwidth the request cannot usefully absorb (compute not yet started). Under batching all N share the GPU equally; queue position is degenerate."
  superadditivity_interaction_wl_a_ms:
    value: "Equal -588, Stall-opt -441, Cal.Stall-opt -406 (all sub-additive)"
    units: "ms (interaction = cell4 - [(cell2)+(cell3)-(cell1)])"
    source: "data/raw/queue_compute_20260917T035604Z/results.txt"
    script: "analysis/queue_compute.py"
    date: "2026-09-17"
    note: "FIXED-N result. Superadditivity hypothesis TESTED AND NOT SUPPORTED: effects partially OFFSET. Mechanism: queueing stretches c 3.55x at N=4, giving the pipeline more shadow to hide transfers, so bimodal damage is smaller under queued-c (Stall-opt WL-A: +1036 ms at iso-c vs +595 ms at queued-c). BW-prop control has interaction exactly 0.0 — it is transfer-bound so max(X,c)=X and the compute window never binds."
  superadditivity_interaction_wl_b_ms:
    value: "Equal -568, Stall-opt -276, Cal.Stall-opt -282 (all sub-additive)"
    units: "ms (interaction = cell4 - [(cell2)+(cell3)-(cell1)])"
    source: "data/raw/queue_compute_20260917T035604Z/results.txt"
    script: "analysis/queue_compute.py"
    date: "2026-09-17"
    note: "FIXED-N result. Same sign as Workload A. BW-prop interaction exactly 0.0."
  four_cell_added_ttft_wl_a_ms:
    value: "Equal [3534.4,4772.4,8855.7,9505.6]; Stall-opt [2839.4,3875.3,7896.2,8491.7]; Cal.Stall-opt [3057.7,3936.0,8070.2,8542.1]; KV-prop [3768.5,4871.2,8379.2,9272.7]; BW-prop [11108.6,12950.4,11309.0,13150.9]"
    units: "ms; cells = [iso+const, iso+bimod, queued+const, queued+bimod]"
    source: "data/raw/queue_compute_20260917T035604Z/results.txt"
    script: "analysis/queue_compute.py"
    date: "2026-09-17"
    note: "Aggregate added TTFT vs isolated infinite-BW baseline L*c_iso, 200 start-time averages, epoch 1s, bimodal depth 2.3 / episode 30s. Naive scheduler (allocates from r*_iso in all cells). FIXED N=4."
  four_cell_added_ttft_wl_b_ms:
    value: "Equal [7012.5,8557.1,11150.8,12127.0]; Stall-opt [5906.4,7336.4,9927.2,11081.2]; Cal.Stall-opt [5906.4,7369.1,9927.2,11108.4]; KV-prop [7012.5,8680.9,11064.4,12294.0]; BW-prop [19235.6,21501.1,19436.0,21701.5]"
    units: "ms; cells = [iso+const, iso+bimod, queued+const, queued+bimod]"
    source: "data/raw/queue_compute_20260917T035604Z/results.txt"
    script: "analysis/queue_compute.py"
    date: "2026-09-17"
    note: "cap 50 Gbps. FIXED N=4."
  inversion_under_queueing:
    value: "holds both cells; effect of queueing MIXED and small (WL-A weaker, WL-B stronger)"
    units: "string"
    source: "data/raw/queue_compute_20260917T035604Z/results.txt"
    script: "analysis/queue_compute.py"
    date: "2026-09-17"
    note: "Stall-opt/Equal degradation gap: WL-A +0.015 (iso) -> +0.002 (queued); WL-B +0.022 -> +0.029. We do NOT claim queueing amplifies the inversion."

  # ── Feedback regime: N is an OUTPUT (analysis/queue_feedback.py) ──
  # The fixed-N results above are the CONTROL (what ObjectCache/Cake's fixed-
  # request-set assumption produces). When concurrency responds to bandwidth
  # (open-loop Poisson arrivals), the SIGN of the storage x compute coupling
  # flips from sub-additive to super-additive. See docs/DECISIONS.md 2026-09-17.
  coupling_sign_contingency:
    value: "fixed-N sub-additive (Stall-opt -441 WL-A); feedback super-additive (Stall-opt +600.9 at 70% load)"
    units: "ms (interaction = cell4 - [(cell2)+(cell3)-(cell1)])"
    source: "data/raw/queue_feedback_20260917T042116Z/results.txt"
    script: "analysis/queue_feedback.py"
    date: "2026-09-17"
    note: "HEADLINE. The sign of the coupling is determined by whether concurrency can respond to bandwidth. Not 'we found superadditivity' — the fixed-N and feedback results are a PAIR."
  feedback_interaction_stall_opt_ms:
    value: "50% +79.4, 70% +600.9, 85% +1140.8 (all SUPER-additive)"
    units: "ms interaction; load as fraction of ~1.59 req/s capacity"
    source: "data/raw/queue_feedback_20260917T042116Z/results.txt"
    script: "analysis/queue_feedback.py"
    date: "2026-09-17"
    note: "Non-censored loads only (0.0% unfinished at 30-85%). 95% EXCLUDED — censored and asymmetric (Equal 4.4% unfinished, Stall-opt 1.7%, BW-prop 0%), which deflates Equal's tail. Equal interaction: 50% +93.5, 70% +545.8, 85% +944.3. BW-prop ~0 until saturation (transfer-bound control)."
  feedback_metastability_drain_s:
    value: "70% load: 94s (1.57x episode); 85% load: 155s (2.58x episode)"
    units: "s to drain N to pre-episode level after a 60s degradation episode"
    source: "data/raw/queue_feedback_20260917T042116Z/results.txt"
    script: "analysis/queue_feedback.py"
    date: "2026-09-17"
    note: "STRONGEST single finding. The queue built during a 60s bandwidth-degradation episode outlives its cause by 1.5-2.6x after bandwidth fully recovers. Connects to CacheGen estimator blindness: a throughput-based bandwidth estimator sees a healthy path during the drain window while the system is still degraded, for a reason (occupancy) it cannot observe. 95% load excluded as intrinsic instability (pre-episode N~28 and climbing)."
  feedback_N_response:
    value: "peak N=41, mean N=12.56; mean N 13.33 low-BW vs 11.79 high-BW"
    units: "count of concurrent requests"
    source: "data/raw/queue_feedback_20260917T042116Z/N_timeseries.csv"
    script: "analysis/queue_feedback.py"
    date: "2026-09-17"
    note: "Representative run: 85% load, bimodal BW, Stall-opt, queued. N tracks bandwidth inversely (ramps in low-BW episodes, drains on recovery) — confirms the feedback loop closes. Plot: N_vs_bw.png."
  feedback_effective_capacity:
    value: "below the 1.59 req/s compute-only estimate (INFERRED, not measured)"
    units: "req/s"
    source: "data/raw/queue_feedback_20260917T042116Z/results.txt"
    script: "analysis/queue_feedback.py"
    date: "2026-09-17"
    note: "INFERENCE from observing intrinsic instability at 95% offered load (pre-episode N climbing), not a direct measurement. Naive r*_iso scheduling + queueing overhead reduce effective capacity below the compute-bound 1.59 req/s. To MEASURE it: sweep arrival rate with NO degradation episode and find where mean N stops draining (the stability boundary)."

