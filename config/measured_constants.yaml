queue_aware_compute:
  # Breaking ObjectCache's fixed-compute-window assumption (arXiv:2605.22850).
  # ┌─────────────────────────────────────────────────────────────────────┐
  # │ SCOPE: every number here is a FIXED-N result (N=4, the workload size).│
  # │ It tests "compute queue deepens -> c stretches" and NOT "transfers    │
  # │ stretch -> more requests in flight". Concurrency is an INPUT, not an  │
  # │ output. The concurrency-feedback channel is untested (planned         │
  # │ discrete-event follow-on). Do not read sub-additivity as "the effects │
  # │ never compound" — only that they don't through the compute-window     │
  # │ channel at fixed N. See docs/DECISIONS.md 2026-09-17.                  │
  # └─────────────────────────────────────────────────────────────────────┘
  # Pure simulation. Uses OUR vLLM prefill coefficients (a=3.5158e-5,
  # b=5.8979e-10; H100 NVL 400W, SM 960-1035 MHz, FlashAttn v3), NOT the
  # paper's A100 Table A8 numbers. Compute window c = T_prefill(uncached)/L,
  # uncached = ctx*(1-hit).
  rstar_overestimate_factor:
    value: "2.0 / 4.0 / 8.0 / 16.0 at N=2/4/8/16 (slope=1.0)"
    units: "dimensionless ratio"
    source: "data/raw/rerun_bc_157004.out"
    script: "analysis/queue_compute.py"
    date: "2026-09-19"
    note: "CORRECTED 2026-09-19 for slope=1.0. r*_iso / r*_queued = 1 + 1.0*(N-1) = N. ObjectCache allocates r*_iso, so it over-provisions bandwidth to a queued request by Nx — bandwidth the request cannot usefully absorb (compute not yet started). Previous values (1.85/3.55/6.95/13.75) used the superseded 0.85 slope."
  superadditivity_interaction_wl_a_ms:
    value: "WITHDRAWN — sub-additivity depends on unconditional overlap. At slope=1.0: Equal -588, Stall-opt -431, Cal.SO -432"
    units: "ms (interaction = cell4 - [(cell2)+(cell3)-(cell1)])"
    source: "data/raw/overlap_sweep_157207.out"
    script: "scripts/overlap_sweep.py"
    date: "2026-09-20"
    note: "WITHDRAWN 2026-09-20 as a mechanism finding. Sub-additivity scales linearly with overlap coverage: +3.5 ms at 0/31 (no overlap) to -430.8 ms at 31/31 (full overlap), ~14 ms per pipelined layer. Equal at 0/31 = +2.1 ms (zero), confirming no other channel. The 31/31 model IS ObjectCache's Equation 3, but the operative assumption is whether transfer may overlap time spent queued behind other requests (c_wall) vs only the request's own compute (c_useful). vLLM 0.29.0 KV connector source confirms: KV reads start AFTER scheduler admits request to batch, not while waiting in queue — so queueing time does NOT provide overlap in the real system."
  superadditivity_interaction_wl_b_ms:
    value: "WITHDRAWN — sub-additivity depends on unconditional overlap. At slope=1.0: Equal -568, Stall-opt -313, Cal.SO -319"
    units: "ms (interaction = cell4 - [(cell2)+(cell3)-(cell1)])"
    source: "data/raw/overlap_sweep_157207.out"
    script: "scripts/overlap_sweep.py"
    date: "2026-09-20"
    note: "WITHDRAWN 2026-09-20. Same analysis as WL-A. Equal at 0/31 = -0.4 ms (zero)."
