  # ── Feedback regime: N is an OUTPUT (analysis/queue_feedback.py) ──
  # The fixed-N results above are the CONTROL (what ObjectCache/Cake's fixed-
  # request-set assumption produces). When concurrency responds to bandwidth
  # (open-loop Poisson arrivals), the SIGN of the storage x compute coupling
  # flips from sub-additive to super-additive. See docs/DECISIONS.md 2026-09-17.
  coupling_sign_contingency:
