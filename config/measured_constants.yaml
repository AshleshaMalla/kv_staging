fetch_overhead:
  metadata_open_stat_close_us:
    value: 50
    units: "us"
    source: "inline measurement 2026-09-15"
    script: "inline (python3, NFS open/fstat/close)"
    date: "2026-09-15"
    note: "NFS metadata per-file: open ~20us, fstat ~10us, close ~15us. Negligible per-token when amortized over a full KV cache read."

  # ── Naive path (torch.load + pageable .cuda()) ──
  # NOT representative of production KV cache systems. Kept for comparison.
  # torch.load uses Python pickle: object graph deserialization, fresh CPU
  # allocation, and copy. Pageable .cuda() goes through a driver bounce buffer.
  # Real systems (LMCache, Mooncake, SGLang HiCache) use raw binary reads
  # into pre-allocated pinned buffers with no deserialization.
  naive_d_us_per_token:
    value: 122.5
    units: "us/token"
    source: "inline measurement 2026-09-15"
    script: "inline (torch.load, map_location=cpu)"
    date: "2026-09-15"
    note: "NAIVE PATH — NOT REPRESENTATIVE. torch.load (pickle) from NFS to CPU. Implied 1.07 GB/s — 3-5x slower than raw fio reads because this measures CPU deserialization overhead, not I/O. Superseded by realistic_d_us_per_token."
  naive_h_us_per_token:
    value: 12.8
    units: "us/token"
    source: "inline measurement 2026-09-15"
    script: "inline (tensor.cuda(), torch.cuda.synchronize)"
    date: "2026-09-15"
    note: "NAIVE PATH — NOT REPRESENTATIVE. Pageable .cuda() transfer. Implied 10.2 GB/s — signature of driver bounce buffer. PCIe Gen5 x16 with pinned memory does 40-60 GB/s. Superseded by realistic_h_us_per_token."
  naive_dh_us_per_token:
    value: 135.3
    units: "us/token"
    source: "inline measurement 2026-09-15"
    script: "inline"
    date: "2026-09-15"
    note: "NAIVE PATH — NOT REPRESENTATIVE. Sum of torch.load + pageable .cuda(). 2.0x higher than realistic path. The naive-vs-realistic delta (135.3 vs 67.7 us/tok) quantifies how much the loading mechanism matters relative to storage bandwidth."

  # ── v1 realistic path (raw binary read into bytearray + pinned H2D) ──
  # SUPERSEDED by v2. Double-counted T_svc and D as separate terms.
  # Read into a Python bytearray (not pinned) at 2.0 GB/s, then measured
  # H2D separately. Kept for the progression comparison.
  v1_d_us_per_token:
    value: 65.0
    units: "us/token"
    source: "data/raw/fetch_overhead_20260915T201815Z.json"
    script: "scripts/measure_fetch_overhead.py"
    date: "2026-09-15"
    note: "SUPERSEDED by v2. os.preadv into Python bytearray (not pinned). Implied 2.02 GB/s. Double-counted with T_svc in crossover model."
  v1_h_us_per_token:
    value: 2.73
    units: "us/token"
    source: "data/raw/fetch_overhead_20260915T201815Z.json"
    script: "scripts/measure_fetch_overhead.py"
    date: "2026-09-15"
    note: "SUPERSEDED by v2. Pinned .to('cuda'). Implied 49.0 GB/s. Correct mechanism but H2D was measured separately from read."
  v1_dh_us_per_token:
    value: 67.7
    units: "us/token"
    source: "data/raw/fetch_overhead_20260915T201815Z.json"
    script: "scripts/measure_fetch_overhead.py"
    date: "2026-09-15"
    note: "SUPERSEDED by v2. D+H with double-counted T_svc. 2.0x higher than v2."

  # ── v2 corrected path (single read-into-pinned + O_DIRECT + H2D) ──
  # No double counting. T_read_into_pinned IS the full disk-to-host cost
  # (replaces both T_svc and D from earlier models). Uses O_DIRECT to
  # bypass page cache, matching fio --direct=1. Reads directly into a
  # pinned CUDA host buffer — the same mechanism production KV cache
  # systems use (LMCache, Mooncake, SGLang HiCache).
  v2_read_into_pinned_us_per_token:
    value: 44.9
    units: "us/token"
    source: "data/raw/fetch_overhead_v2_20260915T203940Z.json"
    script: "scripts/measure_fetch_overhead_v2.py"
    date: "2026-09-15"
    note: "os.preadv with O_DIRECT into pinned torch tensor. Implied 2.92 GB/s at steady state (L>=32768). This IS the full disk-to-host cost — no separate T_svc term. Within fio-measured range (2.6-6.0 GB/s)."
  v2_h_to_gpu_us_per_token:
    value: 2.38
    units: "us/token"
    source: "data/raw/fetch_overhead_v2_20260915T203940Z.json"
    script: "scripts/measure_fetch_overhead_v2.py"
    date: "2026-09-15"
    note: "Pinned .to('cuda', non_blocking=True). Implied 55.3 GB/s — PCIe Gen5 x16 range."
  v2_full_pipeline_us_per_token:
    value: 47.3
    units: "us/token"
    source: "data/raw/fetch_overhead_v2_20260915T203940Z.json"
    script: "scripts/measure_fetch_overhead_v2.py"
    date: "2026-09-15"
    note: "Full pipeline: read-into-pinned + H2D, measured end-to-end. 4.73e-5 s/tok. 1.35x the vLLM prefill linear coefficient (3.5158e-5). Note: an earlier version of this note cited 1.37x against the HF coefficient (3.4551e-5); corrected 2026-09-18."
  pin_alloc_us:
    value: 12
    units: "us"
    source: "data/raw/fetch_overhead_v2_20260915T203940Z.json"
    script: "scripts/measure_fetch_overhead_v2.py"
    date: "2026-09-15"
    note: "One-time cost of torch.empty(pin_memory=True). Amortized to zero in production systems using a pinned buffer pool."
  metadata_amortized_s_per_token:
    value: 6.1e-09
    units: "s/token"
    source: "inline measurement 2026-09-15"
    script: "inline (derived: metadata_open_stat_close_us / 8192 tokens per chunk)"
    date: "2026-09-15"
    note: "M = 50 us metadata / 8192 tokens per chunk = 6.1e-9 s/tok. Negligible (0.006 us/tok) but carried for completeness in T_fetch = S/BW + H + M."
  queueing_us:
    value: null
    units: "us"
    source: "data/raw/prefill_loaded_v2_20260916T053020Z.json"
    script: "scripts/prefill_loaded_sweep_v2.py"
    date: "2026-09-16"
    note: "NFS-side queueing: not directly measurable. GPU-side queueing: measured and modeled as Q(N) = (N-1) × service_time. This is the dominant queueing term — GPU serialization, not NFS, is the bottleneck."

  # ── Overhead progression (the loading mechanism finding) ──
  # The 3-step progression quantifies how much the fetch mechanism matters:
  #   naive (torch.load + pageable):  135.3 us/tok  (3.9x prefill a)
  #   v1 (bytearray + pinned, dbl):    67.7 us/tok  (2.0x prefill a)
  #   v2 (pinned + O_DIRECT, single):  47.3 us/tok  (1.35x prefill a)
  # Going from naive to v2 is a 2.9x reduction. The mechanism matters more
  # than the storage bandwidth for files in the KV cache size range.

