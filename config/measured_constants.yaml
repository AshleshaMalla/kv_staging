    units: "string"
    source: "data/raw/metastability_deep_157007.out"
    script: "scripts/metastability_deep.py"
    date: "2026-09-19"
    note: "WITHDRAWN 2026-09-19. 30-seed replication at 70% load, slope=1.0, against fluid-queue baseline t_drain=(n_end-preN)/(mu-lambda): simulated/fluid ratio mean=1.53, MEDIAN=1.09, std=1.58, range [0.00,7.24]. 15/28 seeds above 1.0, 13/28 below. Drain persistence mean=1.09x, median=0.75x, std=1.26x; only 9/27 draining seeds exceed 1.0x. Cannot distinguish from ordinary backlog recovery. The original 130s/2.16x (seed 7) was the second-highest of 5; 94s/1.57x (slope=0.85 era) was a single seed. The preN->drain mechanism (r=-0.031 at n=30) does not exist. What predicts drain time is delta_N (r=0.536) — how much backlog built — which is ordinary queue behavior. The 85% row excluded as intrinsic instability (no-episode control trends upward, same logic as 95% exclusion)."
