    note: "SUPERSEDED 2026-09-19. The 0.85 slope came from diagnose_batching.py (job 155248) — a single unreplicated N=4 measurement at L=4096 with NO warmup on rpg-93-5. The N=1 baseline (0.1546s) included cold-start costs (JIT, memory allocation) that inflated the denominator, producing ratio=3.45x (slope 0.82) instead of the true ~4.0x (slope ~1.0). The loaded sweep (prefill_loaded_sweep_v2.py) measured the same configuration with warmup and 3 reps at the same time and found ratio=3.978 (slope 0.993), but the diagnostic result was adopted because it seemed more targeted and its result was more dramatic. The 0.85 propagated into queue_compute.py, queue_feedback.py, and all simulation results. Corrected by 14 independent measurements across 3 nodes, 5 batch budgets, all showing slope ~1.0."
