    value: 7.5003e-10
    units: "s/token^2"
    source: "data/raw/prefill_20260915T180751Z.json"
    script: "scripts/prefill_sweep.py"
    date: "2026-09-15"
    note: "HF transformers forward(), no FlashAttn. b is 27% higher than vLLM — combination of HF vs FlashAttn v3 attention and possible clock-state mixing across lengths. SUPERSEDED by vLLM coefficient."
