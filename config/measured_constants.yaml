    source: "data/raw/contingent_sign_test_157206.out"
    script: "scripts/contingent_sign_test.py"
    date: "2026-09-20"
    note: "WITHDRAWN 2026-09-20. (1) Feedback super-additivity: 30-seed CIs exclude zero (30%: [+25,+48], 50%: [+127,+209], 70%: [+710,+1054] ms), but a convexity baseline (fair-share queue, no pipeline, no overlap) reproduces and exceeds it (sim-baseline: -22 ms at 50%, -147 ms at 70%, CIs excluding zero on negative side). Our layer pipeline dampens convexity. The interaction is textbook, not KV-specific. (2) Fixed-N sub-additivity: overlap sweep (0/31 to 31/31) shows interaction scales linearly from +3.5 ms (no overlap) to -430.8 ms (full overlap), ~14 ms per pipelined layer. Equal at 0/31 gives +2.1 (WL-A) / -0.4 (WL-B): no other channel. Sub-additivity is entirely from crediting transfer overlap with c_wall."
  feedback_interaction_stall_opt_ms:
    value: "WITHDRAWN as coupling finding — queueing convexity. Raw: 30% +36, 50% +167, 70% +874 ms (30-seed means, slope=1.0)"
